name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet format VbCodeGraph.slnx --verify-no-changes
      - run: dotnet test VbCodeGraph.slnx -c Release
      - name: Analyze the sample project
        run: |
          dotnet run --project src/VbCodeGraph -c Release --no-build -- analyze samples/LegacyShop -o graph.json
          dotnet run --project src/VbCodeGraph -c Release --no-build -- calltree graph.json btnConfirm_Click
